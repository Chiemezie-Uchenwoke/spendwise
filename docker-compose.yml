version: "3.8"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: spendwise-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SPENDWISE_DB_URL=${SPENDWISE_DB_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
    volumes:
      - ./server:/usr/src/app

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: spendwise-client
    ports:
      - "5173:80"
    depends_on:
      - server

  mongo:
    image: mongo:6
    container_name: spendwise-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: spendwiseappbase
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
